services:
  grok-reg-tool:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: grok-reg-tool:latest
    container_name: grok-reg-tool
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6657}:6657"
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
    environment:
      PORT: "6657"
      BIND_HOST: "0.0.0.0"
      STATIC_ROOT: "/app/out/renderer"
      DATA_DIR: "/data"
      PYTHON_PATH: "/usr/local/bin/python3"
      REGISTER_DIR: "/app/register"
      SSO_DIR: "/data/sso"
      MAIL_API_BASE: "${MAIL_API_BASE:-}"
      MAIL_ADMIN_AUTH: "${MAIL_ADMIN_AUTH:-}"
      MAIL_DOMAIN: "${MAIL_DOMAIN:-}"
      RUN_COUNT: "${RUN_COUNT:-10}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      BROWSER_PROXY: "${BROWSER_PROXY:-}"
      BROWSER_PATH: "/usr/bin/chromium"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      MANUAL_TURNSTILE_TIMEOUT: "${MANUAL_TURNSTILE_TIMEOUT:-300}"
      MANUAL_TURNSTILE_URL: "http://127.0.0.1:${NOVNC_PORT:-6080}/vnc.html"
    volumes:
      - ./data:/data
